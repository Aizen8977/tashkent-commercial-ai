
name: Render property reel

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Telegram chat ID"
        required: true
        type: string
      file_ids:
        description: "Telegram file IDs, one per line"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Download Telegram media
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          FILE_IDS: ${{ inputs.file_ids }}
        run: |
          set -euo pipefail
          mkdir -p media
          i=0

          while IFS= read -r file_id; do
            [ -z "$file_id" ] && continue
            i=$((i+1))

            response=$(curl -fsS \
              "https://api.telegram.org/bot${TOKEN}/getFile?file_id=${file_id}")

            file_path=$(echo "$response" | jq -r '.result.file_path // empty')

            if [ -z "$file_path" ]; then
              echo "Telegram did not return a file path"
              exit 1
            fi

            extension="${file_path##*.}"
            curl -fsSL \
              "https://api.telegram.org/file/bot${TOKEN}/${file_path}" \
              -o "media/${i}.${extension}"

          done <<< "$FILE_IDS"

          test "$(find media -type f | wc -l)" -gt 0

      - name: Render vertical video
        run: |
          set -euo pipefail
          mkdir -p clips
          i=0

          for f in media/*; do
            i=$((i+1))
            ext="${f##*.}"

            case "$ext" in
              jpg|jpeg|png|webp)
                ffmpeg -y -loop 1 -i "$f" -t 5 \
                  -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
                  -r 30 -an "clips/${i}.mp4"
                ;;
              mp4|mov)
                ffmpeg -y -i "$f" \
                  -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
                  -af "aresample=44100" \
                  -c:v libx264 -preset ultrafast \
                  -c:a aac -r 30 -shortest \
                  "clips/${i}.mp4"
                ;;
              *)
                echo "Unsupported media format: $ext"
                exit 1
                ;;
            esac
          done

          for f in clips/*.mp4; do
            echo "file '$f'" >> concat.txt
          done

          ffmpeg -y -f concat -safe 0 -i concat.txt \
            -c:v libx264 -c:a aac \
            -pix_fmt yuv420p -r 30 \
            -movflags +faststart reel.mp4

      - name: Send video to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ inputs.chat_id }}
        run: |
          curl -fsS -X POST \
            -F "chat_id=$CHAT_ID" \
            -F "video=@reel.mp4" \
            "https://api.telegram.org/bot${TOKEN}/sendVideo"
